kind = "web"
previewPath = "/"
title = "Vertex AI Mobile"
version = "1.0.0"
id = "artifacts/mobile"
router = "web"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
